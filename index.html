<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBT Android Diagnostic</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 16px; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
    .btn-main { background: #0284c7; color: white; }
    .btn-action { background: #334155; color: #f8fafc; border: 1px solid #475569; }
    #console { background: #000; color: #00ff66; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 6px; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>VBT Sensor Android Scanner</h2>
  <button class="btn-main" onclick="startScan()">1. Verbind & Scan Sensor</button>
  <button class="btn-action" onclick="forceRead()">2. Lees RX (0003) Handmatig Uit</button>

  <div id="console">Druk op knop 1 om te starten...</div>

  <script>
    let bleDevice, gattServer, rxChar;

    function log(msg) {
      const el = document.getElementById('console');
      el.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}\n` + el.innerHTML;
    }

    async function startScan() {
      try {
        log("Zoeken naar apparaten met 'acceptAllDevices'...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ff12-0000-1000-8000-00805f9b34fb'
          ]
        });

        log("Verbinden met GATT server...");
        gattServer = await bleDevice.gatt.connect();

        log("Services ophalen...");
        const services = await gattServer.getPrimaryServices();
        log(`Gevonden services: ${services.length}`);

        for (const service of services) {
          log(`\n--> Service UUID: ${service.uuid}`);
          const chars = await service.getCharacteristics();
          for (const c of chars) {
            log(`    - Karakteristiek: ${c.uuid}`);
            log(`      Eigenschappen: Notify=${c.properties.notify}, Read=${c.properties.read}, Write=${c.properties.write}`);

            // Als dit RX (0003) is, koppel notificatie
            if (c.uuid.includes('6e400003') || c.properties.notify) {
              rxChar = c;
              log("    >>> NOTIFY KANAAL GEVONDEN! Abonneren...");
              c.addEventListener('characteristicvaluechanged', (e) => {
                let bytes = new Uint8Array(e.target.value.buffer);
                let hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
                log(`🔥 LIVE DATA: [ ${hex} ]`);
              });
              await c.startNotifications();
              log("    >>> Notificaties succesvol geactiveerd!");
            }
          }
        }
        log("\n✅ Scan voltooid. Trek nu aan het koord!");

      } catch (e) {
        log("❌ FOUT: " + e.message);
      }
    }

    async function forceRead() {
      if (!rxChar) {
        log("⚠️ Geen actief RX kanaal gevonden.");
        return;
      }
      try {
        log("Handmatig 'Read' uitvoeren op RX...");
        const val = await rxChar.readValue();
        let bytes = new Uint8Array(val.buffer);
        let hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
        log(`📖 Handmatige Uitlezing: [ ${hex} ]`);
      } catch(e) {
        log("❌ Read Mislukt: " + e.message);
      }
    }
  </script>
</body>
</html>
