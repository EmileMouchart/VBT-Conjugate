<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westside Hybrid & VBT Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-de: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 850px; margin: 0 auto; }

    h1 { margin-bottom: 10px; font-size: 1.5rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-main); font-size: 0.95rem; margin-bottom: 8px; }
    button.bt-btn { background: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 6px; }
    .status-dot.connected { background: #22c55e; }

    #debugBox {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 6px;
      height: 150px;
      overflow-y: auto;
      border: 1px solid #334155;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Westside VBT Auto-Connect</h1>

  <!-- Bluetooth Controller -->
  <div class="card" style="border: 1px solid #0284c7;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div>
        <strong style="display: flex; align-items: center;">
          <span id="btDot" class="status-dot"></span> VBT Sensor ($ENCODE)
        </strong>
        <span id="btStatusText" style="font-size: 0.8rem; color: var(--text-muted);">Niet verbonden</span>
      </div>
      <button class="bt-btn" style="width: auto; margin: 0;" onclick="connectBluetoothSensor()">
        ⚡ Koppel Sensor
      </button>
    </div>
  </div>

  <!-- Live Speed Input & Drop Warning -->
  <div class="card">
    <label>Gemeten Snelheid (m/s)</label>
    <input type="number" id="inputMetric" placeholder="Trek aan het koord..." step="0.01" style="font-size: 1.5rem; text-align: center; font-weight: bold; color: #38bdf8;">
  </div>

  <!-- Debug Console -->
  <div class="card">
    <h3>🔍 Live Bluetooth Monitor</h3>
    <div id="debugBox">Druk op 'Koppel Sensor' om te starten...</div>
  </div>

  <script>
    let bleDevice = null;
    let rxChar = null;
    let txChar = null;

    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_UUID      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    function logDebug(msg) {
      const box = document.getElementById('debugBox');
      const time = new Date().toLocaleTimeString();
      box.innerHTML = `[${time}] ${msg}\n` + box.innerHTML;
    }

    async function connectBluetoothSensor() {
      const btStatusText = document.getElementById('btStatusText');
      const btDot = document.getElementById('btDot');

      try {
        logDebug("Zoeken naar Bluetooth apparaten...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [NUS_SERVICE_UUID, '0000fff0-0000-1000-8000-00805f9b34fb']
        });

        logDebug("Verbinden met: " + bleDevice.name);
        const server = await bleDevice.gatt.connect();

        btDot.classList.add('connected');
        btStatusText.innerText = "Verbonden: " + bleDevice.name;

        // Ophalen van de Nordic UART Service
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);

        // RX Kanaal (Luisteren naar data)
        rxChar = await service.getCharacteristic(NUS_RX_UUID);
        await rxChar.startNotifications();
        rxChar.addEventListener('characteristicvaluechanged', handleSensorData);
        logDebug("✔️ Luisteren op RX kanaal gestart.");

        // TX Kanaal (Versturen van activatie-pingen)
        try {
          txChar = await service.getCharacteristic(NUS_TX_UUID);
          logDebug("Versturen van activatiesignalen...");

          // Reeks van bekende VBT start-commando's versturen
          const initCmds = [
            new Uint8Array([0x01]),                     // Standard Nordic Start
            new Uint8Array([0xA5, 0x01, 0x01, 0x5A]),   // Queling/Encode Header Init
            new Uint8Array([0xAA, 0x02, 0x01, 0xBB]),   // Binary Stream Trigger
            new Uint8Array([0x00, 0x01]),               // Simple Enable
            new Uint8Array([0x53, 0x54, 0x41, 0x52, 0x54]) // ASCII 'START'
          ];

          for (let cmd of initCmds) {
            await txChar.writeValueWithoutResponse(cmd).catch(e => {});
          }
          logDebug("✔️ Signalen verzonden. Trek krachtig aan het koord!");

        } catch(e) {
          logDebug("TX-kanaal melding: " + e.message);
        }

      } catch (error) {
        logDebug("FOUT: " + error.message);
        btStatusText.innerText = "Koppeling mislukt";
        btDot.classList.remove('connected');
      }
    }

    function handleSensorData(event) {
      const value = event.target.value;
      let bytes = new Uint8Array(value.buffer);
      let hexArray = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
      
      logDebug(`🔥 DATA ONTVANGEN: [ ${hexArray} ]`);

      let inputEl = document.getElementById('inputMetric');
      let valFloat = null;

      // 1. Textuele/ASCII conversie
      const decoder = new TextDecoder('utf-8');
      const textVal = decoder.decode(value).replace(/[^0-9.]/g, '').trim();
      if (textVal.length > 0 && !isNaN(parseFloat(textVal))) {
        valFloat = parseFloat(textVal);
      } 
      // 2. Binary Unpacking (High-Byte / Low-Byte)
      else if (bytes.length >= 2) {
        let rawInt = (bytes[0] << 8) | bytes[1];
        if (rawInt === 0 && bytes.length >= 4) {
          rawInt = (bytes[2] << 8) | bytes[3];
        }
        if (rawInt > 0) {
          valFloat = rawInt > 500 ? rawInt / 1000.0 : rawInt / 100.0;
        }
      }

      if (valFloat !== null && !isNaN(valFloat) && valFloat > 0.05 && valFloat < 5.0) {
        inputEl.value = valFloat.toFixed(2);
        logDebug(`>>> SNELHEID VERWERKT: ${valFloat.toFixed(2)} m/s`);
      }
    }
  </script>
</body>
</html>
