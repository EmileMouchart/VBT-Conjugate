<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBT Raw BLE Dump</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 16px; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; background: #0284c7; color: white; margin-bottom: 12px; font-size: 1rem; }
    #log { background: #000; color: #00ff66; font-family: monospace; font-size: 0.75rem; padding: 12px; border-radius: 6px; height: 350px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>VBT Raw BLE Receiver</h2>
  <button onclick="connectAndListen()">⚡ Verbind & Scan Alle Kanalen</button>
  <div id="log">Status: Klaar om te verbinden...</div>

  <script>
    function print(msg) {
      const logEl = document.getElementById('log');
      logEl.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.innerHTML;
    }

    async function connectAndListen() {
      try {
        print("Zoeken naar alle BLE apparaten...");
        
        // Vraag om apparaat zonder service-filter om Chrome blokkades te vermijden
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ff12-0000-1000-8000-00805f9b34fb'
          ]
        });

        print(`Gekoppeld aan: ${device.name || 'Onbekend'}`);
        const server = await device.gatt.connect();
        print("GATT Server verbonden. Ophalen van primaire services...");

        const services = await server.getPrimaryServices();
        print(`Aantal gevonden services: ${services.length}`);

        let activeListeners = 0;

        for (const service of services) {
          print(`Service: ${service.uuid}`);
          const characteristics = await service.getCharacteristics();

          for (const c of characteristics) {
            print(`  ↳ Char: ${c.uuid} | Properties: Notify=${c.properties.notify}, Write=${c.properties.write}`);

            // Activeer notificaties op elk kanaal dat het ondersteunt
            if (c.properties.notify) {
              try {
                await c.startNotifications();
                c.addEventListener('characteristicvaluechanged', (e) => {
                  let bytes = new Uint8Array(e.target.value.buffer);
                  let hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
                  print(`🔥 DATA OP [${c.uuid.substring(0,8)}]: ${hex}`);
                });
                print(`    ✅ Notificaties AAN op ${c.uuid.substring(0,8)}`);
                activeListeners++;
              } catch (err) {
                print(`    ❌ Notificatie mislukt op ${c.uuid.substring(0,8)}: ${err.message}`);
              }
            }
          }
        }

        if (activeListeners > 0) {
          print(`\n🚀 Succesvol geabonneerd op ${activeListeners} kanalen. Trek NU aan het koord!`);
        } else {
          print("\n⚠️ Geen enkel notificatiekanaal kunnen activeren.");
        }

      } catch (e) {
        print(`❌ FOUT: ${e.message}`);
      }
    }
  </script>
</body>
</html>
