<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBT Android Command Center</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 16px; max-width: 600px; margin: 0 auto; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
    .btn-main { background: #0284c7; color: white; margin-bottom: 20px; font-size: 1.1rem; }
    .btn-cmd { background: #334155; color: #38bdf8; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; }
    #log { background: #000; color: #00ff66; font-family: monospace; font-size: 0.8rem; padding: 12px; border-radius: 6px; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>

  <h2>VBT Command Center</h2>
  
  <button class="btn-main" id="btnConnect" onclick="connect()">1. ⚡ Verbind met Sensor</button>
  
  <div id="log">Wacht op verbinding... (Zorg dat je Bluetooth net even uit/aan hebt gezet!)</div>

  <h3>2. Test Activatie Commando's</h3>
  <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">Druk na het verbinden op één van de knoppen en trek aan het koord. Werkt het niet? Probeer de volgende.</p>
  
  <div class="grid">
    <button class="btn-cmd" onclick="sendCmd([0x01, 0x00])">Stuur [01 00]</button>
    <button class="btn-cmd" onclick="sendCmd([0x01])">Stuur [01]</button>
    <button class="btn-cmd" onclick="sendCmd([0x02])">Stuur [02]</button>
    <button class="btn-cmd" onclick="sendCmd([0x03])">Stuur [03]</button>
  </div>
  
  <button class="btn-cmd" style="margin-top: 8px; justify-content: center; color: #fbbf24;" onclick="readDirect()">Lees 1x Handmatig uit (Forceer)</button>

  <script>
    let rxChar, txChar;

    function print(msg) {
      const logEl = document.getElementById('log');
      logEl.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.innerHTML;
    }

    async function connect() {
      try {
        print("Zoeken naar sensor...");
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        print("GATT Koppelen...");
        const server = await device.gatt.connect();
        
        print("Service openen...");
        const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');

        // RX Kanaal (0003)
        rxChar = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        await rxChar.startNotifications();
        rxChar.addEventListener('characteristicvaluechanged', (e) => {
          let bytes = new Uint8Array(e.target.value.buffer);
          let hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
          print(`🔥 DATA BINNEN: [ ${hex} ]`);
        });
        print("✅ RX Notificaties staan AAN.");

        // TX Kanaal (0002)
        txChar = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
        print("✅ TX Kanaal is klaar voor commando's.");
        print("🚀 KLAAR! Trek aan het koord. Geen data? Gebruik de knoppen hieronder.");

      } catch(e) {
        print("❌ FOUT: " + e.message);
      }
    }

    async function sendCmd(byteArray) {
      if (!txChar) {
        print("⚠️ Niet verbonden met TX kanaal!");
        return;
      }
      try {
        const data = new Uint8Array(byteArray);
        // We proberen netjes te kijken of de sensor een response wil of niet
        if (txChar.properties.write) {
          await txChar.writeValue(data);
          print(`➡️ Verzonden (Met Response): [${byteArray.map(b=>b.toString(16).padStart(2,'0')).join(' ')}]`);
        } else {
          await txChar.writeValueWithoutResponse(data);
          print(`➡️ Verzonden (Zonder Response): [${byteArray.map(b=>b.toString(16).padStart(2,'0')).join(' ')}]`);
        }
      } catch(e) {
        print(`❌ Verzendfout: ${e.message}`);
      }
    }

    async function readDirect() {
      if(!rxChar) return;
      try {
        const val = await rxChar.readValue();
        let bytes = new Uint8Array(val.buffer);
        let hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
        print(`📖 Geforceerde uitlezing: [ ${hex} ]`);
      } catch (e) {
        print(`❌ Uitleesfout: ${e.message}`);
      }
    }
  </script>
</body>
</html>
